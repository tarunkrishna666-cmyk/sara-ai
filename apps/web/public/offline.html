<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>sarA is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#000;color:#e5edff;font:16px/1.6 Inter,system-ui,sans-serif;padding:24px}.card{width:min(460px,100%);border:1px solid #ffffff24;border-radius:28px;background:#111827;padding:28px;text-align:center;box-shadow:0 30px 80px #0008}.logo{width:72px;height:72px}.muted{color:#aab8cf}.button{min-height:48px;border:1px solid #ffffff28;border-radius:16px;background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:#fff;font-weight:700;padding:0 22px;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192x192.png" alt="sarA AI" />
      <h1>You're offline</h1>
      <p class="muted">sarA will reconnect automatically. Your cached workspace remains available.</p>
      <button class="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
